# Combine with docker-compose.yml. Defaults remain observation with live=false.
# This profile has not been Docker-validated in the current audit environment.
services:
  catalog:
    build: {context: .., dockerfile: docker/Dockerfile.python}
    environment:
      BYBIT_TESTNET: ${BYBIT_TESTNET:-true}
    command: ["python", "-m", "strategy.triangle_discovery", "--start-assets", "USDT", "--output", "/catalog/triangles.json"]
    volumes: [execution-catalog:/catalog]
    restart: "no"
  engine-control:
    environment:
      ARB_TRADING_MODE: ${ARB_TRADING_MODE:-observe}
      ARB_TESTNET_TRADING_ENABLED: ${ARB_TESTNET_TRADING_ENABLED:-false}
      ARB_PAPER_TRADING_ENABLED: "false"
      ARB_LIVE_TRADING_ENABLED: "false"
      ARB_DATABASE_URL: postgresql://arbitrage:arbitrage@postgres:5432/arbitrage
      ARB_EXECUTION_ACCOUNT: ${ARB_EXECUTION_ACCOUNT:-}
      ARB_EXECUTION_DEPLOYMENT_PERMIT: /app/permit/deployment.json
      ARB_EXECUTION_STATE_DIR: /app/data/execution
      ARB_TRIANGLE_CONFIG: /catalog/triangles.json
      BYBIT_TESTNET: ${BYBIT_TESTNET:-true}
      BYBIT_API_KEY: ""
      BYBIT_API_SECRET: ""
      BYBIT_TESTNET_API_KEY: ""
      BYBIT_TESTNET_API_SECRET: ""
      BYBIT_TESTNET_API_KEY_FILE: /run/secrets/testnet_key
      BYBIT_TESTNET_API_SECRET_FILE: /run/secrets/testnet_secret
    secrets: [testnet_key, testnet_secret]
    volumes:
      - execution-catalog:/catalog:ro
      - execution-state:/app/data/execution
      - ${ARB_PERMIT_DIRECTORY:-../data/execution-permit}:/app/permit:ro
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      catalog: {condition: service_completed_successfully}
    stop_signal: SIGINT
    stop_grace_period: 20s
    restart: unless-stopped
    mem_limit: 768m
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 5
  api:
    environment:
      ARB_TRADING_MODE: ${ARB_TRADING_MODE:-observe}
      ARB_TESTNET_TRADING_ENABLED: ${ARB_TESTNET_TRADING_ENABLED:-false}
      ARB_PAPER_TRADING_ENABLED: "false"
      ARB_LIVE_TRADING_ENABLED: "false"
      ARB_EXECUTION_DEPLOYMENT_PERMIT: /app/permit/deployment.json
      ARB_EXECUTION_API_KEYS_JSON: ""
      ARB_EXECUTION_API_KEYS_JSON_FILE: /run/secrets/execution_api_grants
      BYBIT_API_KEY: ""
      BYBIT_API_SECRET: ""
      BYBIT_TESTNET_API_KEY: ""
      BYBIT_TESTNET_API_SECRET: ""
      BYBIT_LIVE_API_KEY: ""
      BYBIT_LIVE_API_SECRET: ""
    secrets: [execution_api_grants]
    volumes:
      - ${ARB_PERMIT_DIRECTORY:-../data/execution-permit}:/app/permit:ro
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
secrets:
  testnet_key: {file: "${ARB_TESTNET_KEY_FILE:-../secrets/testnet-key}"}
  testnet_secret: {file: "${ARB_TESTNET_SECRET_FILE:-../secrets/testnet-secret}"}
  execution_api_grants: {file: "${ARB_EXECUTION_GRANTS_FILE:-../secrets/execution-grants.json}"}
volumes:
  execution-state:
  execution-catalog:
