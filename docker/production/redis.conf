bind 0.0.0.0
protected-mode yes
port 0
tls-port 6379
tls-cert-file /run/secrets/redis.pem
tls-key-file /run/secrets/redis.key
tls-ca-cert-file /run/secrets/ca.pem
tls-auth-clients no
aclfile /run/secrets/redis-users.acl
dir /data
appendonly yes
appendfsync always
maxmemory 192mb
maxmemory-policy noeviction
save 900 1
