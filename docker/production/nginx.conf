worker_processes 2;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 server_tokens off;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 client_max_body_size 64k;
 client_header_timeout 10s;
 client_body_timeout 10s;
 send_timeout 15s;
 server {
  listen 8443 ssl;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_certificate /run/secrets/https.pem;
  ssl_certificate_key /run/secrets/https.key;
  root /usr/share/nginx/html;
  index index.html;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; object-src 'none'" always;
  location = /api/metrics { return 404; }
  location /api/ {
   proxy_pass http://api:8000/;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header X-Forwarded-Proto https;
   proxy_connect_timeout 3s;
   proxy_read_timeout 15s;
  }
  location / { try_files $uri $uri/ /index.html; }
 }
}
