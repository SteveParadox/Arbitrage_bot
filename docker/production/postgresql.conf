listen_addresses = '*'
ssl = on
ssl_cert_file = '/run/secrets/postgres.pem'
ssl_key_file = '/run/secrets/postgres.key'
ssl_ca_file = '/run/secrets/ca.pem'
ssl_min_protocol_version = 'TLSv1.2'
hba_file = '/etc/arbitrage/pg_hba.conf'
password_encryption = 'scram-sha-256'
max_connections = 100
shared_buffers = '128MB'
log_connections = off
log_disconnections = off
log_statement = 'none'
log_min_error_statement = 'panic'
