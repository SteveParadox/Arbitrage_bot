# Standalone production deployment; live trading is never enabled here.
name: arbitrage-production
x-hardening:
  read_only: true
  cap_drop: &id001
  - ALL
  security_opt: &id002
  - no-new-privileges:true
  pids_limit: 128
  restart: unless-stopped
  tmpfs: &id004
  - /tmp:rw,nosuid,nodev,size=64m,mode=1777
  logging: &id003
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
x-environment: &id005
  ARB_ENV: production
  ARB_TRADING_MODE: ${ARB_TRADING_MODE:-observe}
  ARB_LIVE_TRADING_ENABLED: 'false'
  ARB_PAPER_TRADING_ENABLED: ${ARB_PAPER_TRADING_ENABLED:-false}
  ARB_TESTNET_TRADING_ENABLED: 'false'
  ARB_DATABASE_URL_FILE: /run/secrets/database-runtime-url
  ARB_DATABASE_SSLMODE: verify-full
  ARB_DATABASE_TLS_CA_CERT: /run/secrets/ca.pem
  ARB_REDIS_URL_FILE: /run/secrets/redis-url
  ARB_REDIS_TLS_CA_CERT: /run/secrets/ca.pem
  ARB_CONTROL_API_TOKEN_FILE: /run/secrets/control-token
  ARB_ENGINE_GRPC_TOKEN_FILE: /run/secrets/grpc-token
  ARB_METRICS_TOKEN_FILE: /run/secrets/metrics-token
  ARB_PAPER_API_KEYS_JSON_FILE: /run/secrets/paper-grants.json
  ARB_EXECUTION_API_KEYS_JSON_FILE: /run/secrets/execution-grants.json
  ARB_ENGINE_GRPC_TLS_CA_CERT: /run/secrets/ca.pem
  ARB_ENGINE_GRPC_TLS_CERT: /run/secrets/api.pem
  ARB_ENGINE_GRPC_TLS_KEY: /run/secrets/api.key
  ARB_ENGINE_GRPC_TARGET: engine-control:50051
  ARB_CORS_ORIGINS: ${ARB_CORS_ORIGINS:?explicit HTTPS origin required}
  ARB_TRUSTED_HOSTS: ${ARB_TRUSTED_HOSTS:?explicit trusted hosts required}
  ARB_API_RATE_LIMIT_PER_MINUTE: '120'
  ARB_DATABASE_POOL_SIZE: '5'
  ARB_DATABASE_POOL_OVERFLOW: '5'
  ARB_DATABASE_POOL_TIMEOUT: '3'
  ARB_CONTROL_STATE_FILE: /app/data/control/trading_state.json
  ARB_RESTORE_MARKER: /app/data/RESTORE_REQUIRED
  ARB_FINANCIAL_INTEGRITY_FILE: /app/data/observability/integrity.json
  ARB_MONITORING_READINESS_FILE: /app/data/observability/monitoring.json
  ARB_ENGINE_METRICS_FILE: /app/data/observability/engine.json
  ARB_BACKUP_STATUS_FILE: /app/data/observability/backup.json
  ARB_RISK_CONFIG: /app/shared/config/risk.json
  ARB_TRIANGLE_CONFIG: /app/data/catalog/triangles.json
  BYBIT_TESTNET: 'false'
services:
  initialize:
    image: busybox:1.37.0
    user: 0:0
    network_mode: none
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - FOWNER
    - DAC_OVERRIDE
    security_opt:
    - no-new-privileges:true
    restart: 'no'
    command:
    - sh
    - -ec
    - mkdir -p /state/control /state/observability /state/catalog /state/event-outbox
      /state/paper /state/execution /backups; chown -R 10001:10001 /state /backups;
      chown 999:999 /postgres /redis; chmod 700 /postgres /redis /state /backups
    volumes:
    - state:/state
    - backups:/backups
    - postgres:/postgres
    - redis:/redis
  postgres:
    read_only: true
    cap_drop: *id001
    security_opt: *id002
    pids_limit: 128
    restart: unless-stopped
    tmpfs:
    - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    - /var/run/postgresql:rw,nosuid,nodev,uid=999,gid=999,size=16m
    logging: *id003
    image: postgres:16.15-bookworm
    user: 999:999
    mem_limit: 768m
    cpus: 1.0
    command:
    - postgres
    - -c
    - config_file=/etc/arbitrage/postgresql.conf
    environment:
      POSTGRES_USER: arb_admin
      POSTGRES_DB: arbitrage
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
    - postgres:/var/lib/postgresql/data
    - ${ARB_SECRETS_DIR:?mounted secret directory required}/postgres-password:/run/secrets/postgres-password:ro
    - ${ARB_SECRETS_DIR}/runtime-role.sql:/docker-entrypoint-initdb.d/10-runtime-role.sql:ro
    - ${ARB_SECRETS_DIR}/postgres.pem:/run/secrets/postgres.pem:ro
    - ${ARB_SECRETS_DIR}/postgres.key:/run/secrets/postgres.key:ro
    - ${ARB_SECRETS_DIR}/ca.pem:/run/secrets/ca.pem:ro
    - ./postgresql.conf:/etc/arbitrage/postgresql.conf:ro
    - ./pg_hba.conf:/etc/arbitrage/pg_hba.conf:ro
    networks:
    - private
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U arb_admin -d arbitrage
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    read_only: true
    cap_drop: *id001
    security_opt: *id002
    pids_limit: 128
    restart: unless-stopped
    tmpfs: *id004
    logging: *id003
    image: redis:7.4.7-bookworm
    user: 999:999
    mem_limit: 256m
    cpus: 0.5
    command:
    - redis-server
    - /etc/arbitrage/redis.conf
    volumes:
    - redis:/data
    - ./redis.conf:/etc/arbitrage/redis.conf:ro
    - ${ARB_SECRETS_DIR}/redis.pem:/run/secrets/redis.pem:ro
    - ${ARB_SECRETS_DIR}/redis.key:/run/secrets/redis.key:ro
    - ${ARB_SECRETS_DIR}/ca.pem:/run/secrets/ca.pem:ro
    - ${ARB_SECRETS_DIR}/redis-users.acl:/run/secrets/redis-users.acl:ro
    networks:
    - private
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$$(awk '$$1 == "user" && $$2 == "arb" {sub(/^>/,"",$$4);print
        $$4}' /run/secrets/redis-users.acl)" redis-cli --tls --cacert /run/secrets/ca.pem
        --sni redis -h redis --user arb ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    read_only: true
    cap_drop: *id001
    security_opt: *id002
    pids_limit: 128
    restart: 'no'
    tmpfs: *id004
    logging: *id003
    build:
      context: ../..
      dockerfile: docker/Dockerfile.python
    user: 10001:10001
    mem_limit: 256m
    cpus: 0.5
    environment: &id007
      ARB_ENV: production
      ARB_TRADING_MODE: ${ARB_TRADING_MODE:-observe}
      ARB_LIVE_TRADING_ENABLED: 'false'
      ARB_PAPER_TRADING_ENABLED: ${ARB_PAPER_TRADING_ENABLED:-false}
      ARB_TESTNET_TRADING_ENABLED: 'false'
      ARB_DATABASE_URL_FILE: /run/secrets/database-admin-url
      ARB_DATABASE_SSLMODE: verify-full
      ARB_DATABASE_TLS_CA_CERT: /run/secrets/ca.pem
      ARB_REDIS_URL_FILE: /run/secrets/redis-url
      ARB_REDIS_TLS_CA_CERT: /run/secrets/ca.pem
      ARB_CONTROL_API_TOKEN_FILE: /run/secrets/control-token
      ARB_ENGINE_GRPC_TOKEN_FILE: /run/secrets/grpc-token
      ARB_METRICS_TOKEN_FILE: /run/secrets/metrics-token
      ARB_PAPER_API_KEYS_JSON_FILE: /run/secrets/paper-grants.json
      ARB_EXECUTION_API_KEYS_JSON_FILE: /run/secrets/execution-grants.json
      ARB_ENGINE_GRPC_TLS_CA_CERT: /run/secrets/ca.pem
      ARB_ENGINE_GRPC_TLS_CERT: /run/secrets/api.pem
      ARB_ENGINE_GRPC_TLS_KEY: /run/secrets/api.key
      ARB_ENGINE_GRPC_TARGET: engine-control:50051
      ARB_CORS_ORIGINS: ${ARB_CORS_ORIGINS:?explicit HTTPS origin required}
      ARB_TRUSTED_HOSTS: ${ARB_TRUSTED_HOSTS:?explicit trusted hosts required}
      ARB_API_RATE_LIMIT_PER_MINUTE: '120'
      ARB_DATABASE_POOL_SIZE: '5'
      ARB_DATABASE_POOL_OVERFLOW: '5'
      ARB_DATABASE_POOL_TIMEOUT: '3'
      ARB_CONTROL_STATE_FILE: /app/data/control/trading_state.json
      ARB_RESTORE_MARKER: /app/data/RESTORE_REQUIRED
      ARB_FINANCIAL_INTEGRITY_FILE: /app/data/observability/integrity.json
      ARB_MONITORING_READINESS_FILE: /app/data/observability/monitoring.json
      ARB_ENGINE_METRICS_FILE: /app/data/observability/engine.json
      ARB_BACKUP_STATUS_FILE: /app/data/observability/backup.json
      ARB_RISK_CONFIG: /app/shared/config/risk.json
      ARB_TRIANGLE_CONFIG: /app/data/catalog/triangles.json
    volumes:
    - ${ARB_SECRETS_DIR}/ca.pem:/run/secrets/ca.pem:ro
    - ${ARB_SECRETS_DIR}/redis-url:/run/secrets/redis-url:ro
    - ${ARB_SECRETS_DIR}/control-token:/run/secrets/control-token:ro
    - ${ARB_SECRETS_DIR}/grpc-token:/run/secrets/grpc-token:ro
    - ${ARB_SECRETS_DIR}/metrics-token:/run/secrets/metrics-token:ro
    - ${ARB_SECRETS_DIR}/paper-grants.json:/run/secrets/paper-grants.json:ro
    - ${ARB_SECRETS_DIR}/execution-grants.json:/run/secrets/execution-grants.json:ro
    - ${ARB_SECRETS_DIR}/database-admin-url:/run/secrets/database-admin-url:ro
    - ${ARB_SECRETS_DIR}/api.pem:/run/secrets/api.pem:ro
    - ${ARB_SECRETS_DIR}/api.key:/run/secrets/api.key:ro
    command:
    - alembic
    - upgrade
    - head
    networks: &id008
    - private
    depends_on: &id009
      postgres:
        condition: service_healthy
  engine-control:
    read_only: true
    cap_drop: *id001
    security_opt: *id002
    pids_limit: 128
    restart: unless-stopped
    tmpfs: *id004
    logging: *id003
    build:
      context: ../..
      dockerfile: docker/Dockerfile.engine
    user: 10001:10001
    mem_limit: 512m
    cpus: 1.5
    environment:
      ARB_ENV: production
      ARB_TRADING_MODE: ${ARB_TRADING_MODE:-observe}
      ARB_LIVE_TRADING_ENABLED: 'false'
      ARB_PAPER_TRADING_ENABLED: ${ARB_PAPER_TRADING_ENABLED:-false}
      ARB_TESTNET_TRADING_ENABLED: 'false'
      ARB_DATABASE_URL_FILE: /run/secrets/database-runtime-url
      ARB_DATABASE_SSLMODE: verify-full
      ARB_DATABASE_TLS_CA_CERT: /run/secrets/ca.pem
      ARB_REDIS_URL_FILE: /run/secrets/redis-url
      ARB_REDIS_TLS_CA_CERT: /run/secrets/ca.pem
      ARB_CONTROL_API_TOKEN_FILE: /run/secrets/control-token
      ARB_ENGINE_GRPC_TOKEN_FILE: /run/secrets/grpc-token
      ARB_METRICS_TOKEN_FILE: /run/secrets/metrics-token
      ARB_PAPER_API_KEYS_JSON_FILE: /run/secrets/paper-grants.json
      ARB_EXECUTION_API_KEYS_JSON_FILE: /run/secrets/execution-grants.json
      ARB_ENGINE_GRPC_TLS_CA_CERT: /run/secrets/ca.pem
      ARB_ENGINE_GRPC_TLS_CERT: /run/secrets/engine.pem
      ARB_ENGINE_GRPC_TLS_KEY: /run/secrets/engine.key
      ARB_ENGINE_GRPC_TARGET: engine-control:50051
      ARB_CORS_ORIGINS: ${ARB_CORS_ORIGINS:?explicit HTTPS origin required}
      ARB_TRUSTED_HOSTS: ${ARB_TRUSTED_HOSTS:?explicit trusted hosts required}
      ARB_API_RATE_LIMIT_PER_MINUTE: '120'
      ARB_DATABASE_POOL_SIZE: '5'
      ARB_DATABASE_POOL_OVERFLOW: '5'
      ARB_DATABASE_POOL_TIMEOUT: '3'
      ARB_CONTROL_STATE_FILE: /app/data/control/trading_state.json
      ARB_RESTORE_MARKER: /app/data/RESTORE_REQUIRED
      ARB_FINANCIAL_INTEGRITY_FILE: /app/data/observability/integrity.json
      ARB_MONITORING_READINESS_FILE: /app/data/observability/monitoring.json
      ARB_ENGINE_METRICS_FILE: /app/data/observability/engine.json
      ARB_BACKUP_STATUS_FILE: /app/data/observability/backup.json
      ARB_RISK_CONFIG: /app/shared/config/risk.json
      ARB_TRIANGLE_CONFIG: /app/data/catalog/triangles.json
      ARB_REPO_ROOT: /app
      ARB_ENGINE_AUTOSTART: ${ARB_ENGINE_AUTOSTART:-false}
      ARB_ENGINE_GRPC_ADDR: 0.0.0.0:50051
      ARB_EVENT_OUTBOX_PATH: /app/data/event-outbox
      ARB_GRPC_IDEMPOTENCY_STORE: /app/data/control/grpc-idempotency
      ARB_OBSERVER_LOCK: /app/data/control/observer.lock
      ARB_PAPER_ACCOUNT: ${ARB_PAPER_ACCOUNT:-demo}
      ARB_PAPER_STATE_DIR: /app/data/paper
      ARB_EXECUTION_STATE_DIR: /app/data/execution
    volumes:
    - state:/app/data
    - ${ARB_SECRETS_DIR}/ca.pem:/run/secrets/ca.pem:ro
    - ${ARB_SECRETS_DIR}/redis-url:/run/secrets/redis-url:ro
    - ${ARB_SECRETS_DIR}/control-token:/run/secrets/control-token:ro
    - ${ARB_SECRETS_DIR}/grpc-token:/run/secrets/grpc-token:ro
    - ${ARB_SECRETS_DIR}/metrics-token:/run/secrets/metrics-token:ro
    - ${ARB_SECRETS_DIR}/paper-grants.json:/run/secrets/paper-grants.json:ro
    - ${ARB_SECRETS_DIR}/execution-grants.json:/run/secrets/execution-grants.json:ro
    - ${ARB_SECRETS_DIR}/database-runtime-url:/run/secrets/database-runtime-url:ro
    - ${ARB_SECRETS_DIR}/engine.pem:/run/secrets/engine.pem:ro
    - ${ARB_SECRETS_DIR}/engine.key:/run/secrets/engine.key:ro
    networks:
    - private
    - egress
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      catalog:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /app/data/observability/engine.json && find /app/data/observability/engine.json
        -mmin -1 | grep -q engine.json
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_signal: SIGINT
    stop_grace_period: 30s
  api:
    read_only: true
    cap_drop: *id001
    security_opt: *id002
    pids_limit: 128
    restart: unless-stopped
    tmpfs: *id004
    logging: *id003
    build:
      context: ../..
      dockerfile: docker/Dockerfile.python
    user: 10001:10001
    mem_limit: 384m
    cpus: 1.0
    environment: *id005
    command:
    - uvicorn
    - api.main:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    - --no-proxy-headers
    - --limit-concurrency
    - '64'
    volumes:
    - state:/app/data:ro
    - type: volume
      source: state
      target: /app/data/control
      volume:
        subpath: control
    - type: volume
      source: state
      target: /app/data/observability
      volume:
        subpath: observability
    - ${ARB_SECRETS_DIR}/ca.pem:/run/secrets/ca.pem:ro
    - ${ARB_SECRETS_DIR}/redis-url:/run/secrets/redis-url:ro
    - ${ARB_SECRETS_DIR}/control-token:/run/secrets/control-token:ro
    - ${ARB_SECRETS_DIR}/grpc-token:/run/secrets/grpc-token:ro
    - ${ARB_SECRETS_DIR}/metrics-token:/run/secrets/metrics-token:ro
    - ${ARB_SECRETS_DIR}/paper-grants.json:/run/secrets/paper-grants.json:ro
    - ${ARB_SECRETS_DIR}/execution-grants.json:/run/secrets/execution-grants.json:ro
    - ${ARB_SECRETS_DIR}/database-runtime-url:/run/secrets/database-runtime-url:ro
    - ${ARB_SECRETS_DIR}/api.pem:/run/secrets/api.pem:ro
    - ${ARB_SECRETS_DIR}/api.key:/run/secrets/api.key:ro
    networks:
    - private
    - web
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez',timeout=2)
      interval: 10s
      timeout: 3s
      retries: 6
  integrity:
    read_only: true
    cap_drop: *id001
    security_opt: *id002
    pids_limit: 128
    restart: unless-stopped
    tmpfs: *id004
    logging: *id003
    build: &id006
      context: ../..
      dockerfile: docker/Dockerfile.python
    user: 10001:10001
    mem_limit: 256m
    cpus: 0.5
    environment: *id005
    command:
    - python
    - /app/scripts/verify_financial_integrity.py
    - --watch-seconds
    - '60'
    volumes:
    - state:/app/data:ro
    - type: volume
      source: state
      target: /app/data/observability
      volume:
        subpath: observability
    - ${ARB_SECRETS_DIR}/ca.pem:/run/secrets/ca.pem:ro
    - ${ARB_SECRETS_DIR}/redis-url:/run/secrets/redis-url:ro
    - ${ARB_SECRETS_DIR}/control-token:/run/secrets/control-token:ro
    - ${ARB_SECRETS_DIR}/grpc-token:/run/secrets/grpc-token:ro
    - ${ARB_SECRETS_DIR}/metrics-token:/run/secrets/metrics-token:ro
    - ${ARB_SECRETS_DIR}/paper-grants.json:/run/secrets/paper-grants.json:ro
    - ${ARB_SECRETS_DIR}/execution-grants.json:/run/secrets/execution-grants.json:ro
    - ${ARB_SECRETS_DIR}/database-runtime-url:/run/secrets/database-runtime-url:ro
    - ${ARB_SECRETS_DIR}/api.pem:/run/secrets/api.pem:ro
    - ${ARB_SECRETS_DIR}/api.key:/run/secrets/api.key:ro
    networks:
    - private
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    read_only: true
    cap_drop: *id001
    security_opt: *id002
    pids_limit: 128
    restart: unless-stopped
    tmpfs: *id004
    logging: *id003
    build:
      context: ../..
      dockerfile: docker/Dockerfile.frontend
    user: 10001:10001
    mem_limit: 128m
    cpus: 0.5
    command:
    - nginx
    - -c
    - /etc/arbitrage/nginx.conf
    - -g
    - daemon off;
    volumes:
    - ./nginx.conf:/etc/arbitrage/nginx.conf:ro
    - ${ARB_SECRETS_DIR}/https.pem:/run/secrets/https.pem:ro
    - ${ARB_SECRETS_DIR}/https.key:/run/secrets/https.key:ro
    networks:
    - web
    ports:
    - 127.0.0.1:8443:8443
    depends_on:
      api:
        condition: service_healthy
  catalog:
    read_only: true
    cap_drop: *id001
    security_opt: *id002
    pids_limit: 128
    restart: 'no'
    tmpfs: *id004
    logging: *id003
    build: *id006
    user: 10001:10001
    mem_limit: 256m
    cpus: 0.5
    networks:
    - egress
    environment:
      BYBIT_TESTNET: 'false'
    command:
    - sh
    - -ec
    - python -m strategy.triangle_discovery --output /app/data/catalog/triangles.json
      --start-assets USDT && python -c "import json; assert json.load(open('/app/data/catalog/triangles.json'))['routes'],
      'no validated routes'"
    volumes:
    - type: volume
      source: state
      target: /app/data/catalog
      volume:
        subpath: catalog
    depends_on:
      initialize:
        condition: service_completed_successfully
  backup:
    read_only: true
    cap_drop: *id001
    security_opt: *id002
    pids_limit: 128
    restart: 'no'
    tmpfs:
    - /tmp:rw,nosuid,nodev,size=1g,mode=1777
    logging: *id003
    build:
      context: ../..
      dockerfile: docker/Dockerfile.backup
    user: 10001:10001
    mem_limit: 2g
    cpus: 1.0
    environment: *id007
    volumes:
    - ${ARB_SECRETS_DIR}/ca.pem:/run/secrets/ca.pem:ro
    - ${ARB_SECRETS_DIR}/redis-url:/run/secrets/redis-url:ro
    - ${ARB_SECRETS_DIR}/control-token:/run/secrets/control-token:ro
    - ${ARB_SECRETS_DIR}/grpc-token:/run/secrets/grpc-token:ro
    - ${ARB_SECRETS_DIR}/metrics-token:/run/secrets/metrics-token:ro
    - ${ARB_SECRETS_DIR}/paper-grants.json:/run/secrets/paper-grants.json:ro
    - ${ARB_SECRETS_DIR}/execution-grants.json:/run/secrets/execution-grants.json:ro
    - ${ARB_SECRETS_DIR}/database-admin-url:/run/secrets/database-admin-url:ro
    - ${ARB_SECRETS_DIR}/api.pem:/run/secrets/api.pem:ro
    - ${ARB_SECRETS_DIR}/api.key:/run/secrets/api.key:ro
    - ${ARB_SECRETS_DIR}/backup-key:/run/secrets/backup-key:ro
    - state:/app/data
    - backups:/backups
    command:
    - --help
    networks: *id008
    depends_on: *id009
    profiles:
    - operations
    entrypoint:
    - python
    - /app/scripts/backup_restore.py
volumes:
  postgres: {}
  redis: {}
  state: {}
  backups: {}
networks:
  private:
    internal: true
  web:
    internal: true
  egress: {}
