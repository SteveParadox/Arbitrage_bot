name: Production infrastructure gates
'on': {pull_request: {}, workflow_dispatch: {}}
permissions: {contents: read}
concurrency: {group: 'production-${{ github.ref }}', cancel-in-progress: true}
jobs:
  security-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env: {ARB_LIVE_TRADING_ENABLED: 'false', CARGO_INCREMENTAL: '0'}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: 'rustfmt, clippy'}
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 redis-server prometheus
      - run: python -m pip install -e 'python[dev]' pip-audit detect-secrets==1.5.0
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - run: cargo build --manifest-path rust/Cargo.toml --workspace
      - run: cargo test --manifest-path rust/Cargo.toml --workspace
      - run: cd python && python -m ruff check .
      - name: Real transport, exporter and encrypted restore regressions
        env: {ARB_RUN_TLS_INTEGRATION: '1'}
        run: |
          mkdir -p ci-evidence
          python -m pytest -q python/tests/test_infrastructure.py python/tests/test_infrastructure_transport.py python/tests/test_production_operations.py --junitxml=ci-evidence/secure-services.xml
      - name: Real integrated regressions and migration roundtrip
        run: python scripts/run_disposable_validation.py full --output ci-evidence/full
      - name: Dependency and tracked/history secret gates
        run: |
          python -m pip_audit -r python/constraints-runtime.txt --no-deps --disable-pip --format=json --output=ci-evidence/python-audit.json
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --file rust/Cargo.lock --json > ci-evidence/rust-audit.json
          python scripts/scan_secrets.py --output ci-evidence/secrets.json
      - run: |
          promtool check rules docker/monitoring/alerts.yml
          cd docker/monitoring && promtool test rules rules.test.yml
      - name: Compose model and container build
        run: |
          python scripts/provision_production.py /tmp/arb-ci-secrets --https-host localhost
          ARB_SECRETS_DIR=/tmp/arb-ci-secrets ARB_CORS_ORIGINS=https://localhost ARB_TRUSTED_HOSTS=localhost,api docker compose -f docker/production/compose.yml -f docker/production/monitoring.yml config --format json > ci-evidence/compose.json
          python scripts/check_production_compose.py ci-evidence/compose.json
          docker build -f docker/Dockerfile.engine -t arb-engine:${{ github.sha }} .
          docker build -f docker/Dockerfile.python -t arb-api:${{ github.sha }} .
          docker build -f docker/Dockerfile.frontend -t arb-frontend:${{ github.sha }} .
          docker build -f docker/Dockerfile.backup -t arb-backup:${{ github.sha }} .
      # Official v0.36.0 ref resolved during implementation; do not use mutable master.
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with: {scan-type: fs, scan-ref: ., scanners: 'vuln,secret,misconfig', severity: 'HIGH,CRITICAL', exit-code: '1', format: json, output: ci-evidence/trivy-fs.json}
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with: {scan-type: image, image-ref: 'arb-engine:${{ github.sha }}', severity: 'HIGH,CRITICAL', exit-code: '1', format: json, output: ci-evidence/trivy-engine.json}
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with: {scan-type: image, image-ref: 'arb-api:${{ github.sha }}', severity: 'HIGH,CRITICAL', exit-code: '1', format: json, output: ci-evidence/trivy-api.json}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: production-gates, path: ci-evidence, retention-days: 14}
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env: {ARB_LIVE_TRADING_ENABLED: 'false', CARGO_INCREMENTAL: '0'}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 redis-server
      - run: python -m pip install -e 'python[dev]'
      - run: cargo build --manifest-path rust/Cargo.toml --workspace
      - run: python scripts/run_disposable_validation.py soak --profile smoke --output ci-evidence/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: smoke-soak, path: ci-evidence, retention-days: 14}
